<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  role="img"
  aria-label="Personal JobHunter"
>
  <!-- The allowance mark: a pine ground with two daily search slots,
       one spent and one still available. -->
  <rect width="32" height="32" rx="5" fill="#1E4D3D" />
  <rect x="8" y="12" width="16" height="3" rx="0.5" fill="#F3F5F0" />
  <rect
    x="8"
    y="18"
    width="16"
    height="3"
    rx="0.5"
    fill="none"
    stroke="#F3F5F0"
    stroke-width="1.5"
    stroke-opacity="0.55"
  />
</svg>
